
name: Playwright UI Automation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: |
          mkdir -p reports
          python -m pytest \
            --html=reports/report.html \
            --self-contained-html \
            --alluredir=allure-results

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -d allure-results ] && [ -n "$(ls -A allure-results)" ]; then
            curl -fsSL \
              https://github.com/allure-framework/allure2/releases/download/2.46.1/allure-2.46.1.tgz \
              -o /tmp/allure.tgz
            mkdir -p /tmp/allure-cli
            tar -xzf /tmp/allure.tgz -C /tmp/allure-cli --strip-components=1
            /tmp/allure-cli/bin/allure generate allure-results \
              --clean -o allure-report
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            allure-results/
            allure-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
